[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-blake3-hash"
version = "1.0.0"
description = "BLAKE3 cryptographic hash function implementation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "blake3", "hash", "cryptography", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-blake3-hash"
Repository = "https://github.com/ElNeMeR70/py-blake3-hash"
